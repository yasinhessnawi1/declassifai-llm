# =============================================================================
# LLM Fine-Tuning Configuration
# Central config for the entire pipeline: data prep, training, eval, export.
# =============================================================================

# -- Base Model ---------------------------------------------------------------
model:
  name: "Qwen/Qwen3.5-2B"       # HuggingFace model ID
  max_seq_length: 2048                      # Max tokens per training sample
  load_in_4bit: true                        # QLoRA 4-bit quantization
  bnb_4bit_compute_dtype: "float16"           # float16 for RTX 2060/V100, bfloat16 for Ampere+
  bnb_4bit_quant_type: "nf4"               # Quantization type
  bnb_4bit_use_double_quant: true          # Double quantization for memory savings
  trust_remote_code: true

# -- LoRA Adapter -------------------------------------------------------------
lora:
  r: 64                                    # LoRA rank (higher = more capacity)
  lora_alpha: 128                          # LoRA scaling factor (usually 2*r)
  lora_dropout: 0.05                       # Dropout on LoRA layers
  target_modules:                          # Which layers to adapt
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  task_type: "CAUSAL_LM"
  bias: "none"

# -- Dataset ------------------------------------------------------------------
dataset:
  source: "data/combined_data.jsonl"       # Raw Gemini-labeled JSONL
  processed_dir: "data/processed"          # Where chat-formatted data goes
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"
  test_file: "data/processed/test.jsonl"
  val_split: 0.05                          # 5% for validation
  test_split: 0.02                         # 2% for test
  seed: 42
  max_samples: null                        # null = use all, set integer to limit

# -- Entity Types (maps training data labels to detection service labels) -----
entity_types:
  PERSON: "Full names of individuals"
  NO_ADDRESS: "Norwegian street addresses with house numbers"
  POSTAL_CODE: "Norwegian postal codes (4 digits)"
  NO_PHONE_NUMBER: "Norwegian phone numbers (8 digits, +47)"
  EMAIL_ADDRESS: "Email addresses"
  DATE_TIME: "Dates and times tied to identifiable persons"
  HEALTH_INFO: "Medical conditions, diseases, medications, disabilities"
  EMPLOYMENT_INFO: "Job titles, workplace, professional roles"
  CRIMINAL_RECORD: "Convictions, arrests, criminal charges"
  FINANCIAL_INFO: "Bank accounts, income, debt, financial status"
  ECONOMIC_STATUS: "References to economic hardship or wealth"
  GOV_ID: "National ID numbers, fødselsnummer, D-nummer, org.nr"
  FAMILY_RELATION: "Family relationships (spouse, child, parent)"
  POLITICAL_CASE: "Political opinions, party membership"
  SEXUAL_ORIENTATION: "Sexual orientation or gender identity"

# -- Training -----------------------------------------------------------------
training:
  output_dir: "models/qlora_adapter"       # Where adapter weights are saved
  num_train_epochs: 3                      # 3 epochs for good convergence
  per_device_train_batch_size: 1           # 1 for 6GB VRAM
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32         # Effective batch = 32
  learning_rate: 1.0e-4                    # Lower LR for 7B (more stable)
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 25
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  fp16: true
  bf16: false
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  max_grad_norm: 0.3
  group_by_length: true
  report_to: "none"
  dataloader_num_workers: 0                # 0 for Windows

# -- Prompt Template ----------------------------------------------------------
prompt:
  system_instruction: |
    You are a precise Named Entity Recognition (NER) system for Norwegian texts (Bokmal/Nynorsk).
    Extract ALL personally identifiable information and sensitive data from the text.

    RULES:
    1. ONLY extract text that genuinely matches the entity type definition
    2. Use EXACT text from the document (verbatim quotes)
    3. If an entity type is NOT present, use an empty array []
    4. Do NOT hallucinate or invent entities
    5. Output ONLY valid JSON, no explanation or markdown

  user_template: |
    Extract entities from this Norwegian text. Return JSON with entity types as keys and arrays of extracted strings as values.

    Entity types to extract:
    {entity_types}

    Text:
    {text}

  assistant_prefix: ""  # Model generates the JSON output directly

# -- Export (merge adapter into base model) -----------------------------------
export:
  merged_dir: "models/merged"              # Full merged model
  push_to_hub: false                       # Set true to upload to HuggingFace
  hub_model_id: ""                         # e.g., "yasin9999/hideme-ner-7b"

# -- Evaluation ---------------------------------------------------------------
evaluation:
  output_dir: "evaluation"
  num_samples: 200                         # How many test samples to evaluate
  threshold: 0.5                           # Score threshold (for future use)
  per_type_metrics: true                   # Show per-entity-type breakdown
