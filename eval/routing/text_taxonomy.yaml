# DRAFT copy of the text taxonomy, for the scorer's engine label maps and gold-label validation.
#
# Built from the engine research note's mapping table (section 1), NOT from the service's
# contract file. Only the fields the scorer needs are here: id, tier, rules, engine_labels,
# shared_labels. An empty engine list means the engine has no label for the type (a gap).
# `shared_labels` on LICENSE_PLATE: GLiNER's plate labels also serve VESSEL_REGISTRATION.
#
# TODO(pin): when the taxonomy branch in detection_service merges, replace this file with a
# byte-for-byte copy of contract/text_taxonomy.yaml and update taxonomy_pin.json
# (repository, path, commit, blob hash, draft=false). Until then the pin records a draft.
schema: 1
version: 1.0.0
