# The one list of text categories: 59 types in three tiers, with the old names each engine used and where the engines'
# own labels map. The source of truth for every repo that detects, stores or shows a text category; the other repos
# keep a pinned copy. contract/text_contract.fixture.json is made from it by scripts/gen_text_contract.py.
schema: 1
version: "1.0.0"   # minor: alias, label or field added; major: an alias target changes (needs a migration note)
change_rule: >-
  An id is never renamed, removed or reused. The list stays at 59; new needs go to AI search.
